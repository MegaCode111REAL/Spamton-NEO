name: Build script tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          npm install --global typescript@5.9.3
          npm install --no-save p5@1.4.0 @types/p5@1.7.7

      - name: Copy p5 runtime libraries
        run: |
          test -f node_modules/p5/lib/p5.js
          test -f node_modules/p5/lib/addons/p5.sound.min.js
          cp node_modules/p5/lib/p5.js ./p5.js
          cp node_modules/p5/lib/addons/p5.sound.min.js ./p5.sound.min.js

      - name: Compile TypeScript
        run: tsc --pretty false

      - name: Generate script tags
        run: python generate_script_tags.py > script-tags.txt

      - name: Generate asset preload calls
        run: python preload_assets.py > preload-assets.txt

      - name: Commit generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- dist/ script-tags.txt preload-assets.txt p5.js p5.sound.min.js
          if git diff --cached --quiet; then
            echo "Generated build is already up to date."
          else
            git commit -m "Build script tags and generated assets"
            git push
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: spamton-neo-build
          path: |
            script-tags.txt
            preload-assets.txt
            dist/
            p5.js
            p5.sound.min.js
          if-no-files-found: error
